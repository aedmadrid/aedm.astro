name: Deploy to GitHub Pages

on:
  # Recompila en cada push a main.
  push:
    branches: [ main ]
  # Recompila cada 15 min para refrescar los datos del API y, sobre todo, las
  # URLs de imagen de Notion, que caducan a los 60 minutos.
  schedule:
    - cron: "*/15 * * * *"
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Permite que este trabajo clone el repositorio y cree un despliegue de página
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
